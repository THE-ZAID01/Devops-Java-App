name: Static Site CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'campusgigs-login/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: campusgigs-login/
